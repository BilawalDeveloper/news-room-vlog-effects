<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js AI News Room</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0e1a; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; color: #c9a227; z-index: 100; background: rgba(10,14,26,0.8); padding: 12px; border-radius: 8px; max-width: 340px; }
    button { background: #c9a227; color: #0a0e1a; border: none; padding: 6px 10px; margin: 3px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
    button:hover { background: #f5e6a3; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>AI News Room — Three.js</strong><br>
    <button onclick="loadEffect('params')">70B Params</button>
    <button onclick="loadEffect('benchmark')">Benchmarks</button>
    <button onclick="loadBars()">Growing Bars</button>
    <button onclick="loadEffect('vs')">OpenAI vs Anthropic</button>
    <button onclick="loadEffect('valuation')">$157B</button>
    <button onclick="loadEffect('safety')">Safety</button>
    <button onclick="loadEffect('gpu')">GPU Cluster</button>
    <button onclick="loadEffect('agent')">Agent</button>
    <button onclick="loadEffect('breaking')">Breaking</button>
    <button onclick="clearEffects()">Clear</button><br>
    <small>Drag to orbit • Scroll to zoom</small>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e1a);
    scene.fog = new THREE.Fog(0x0a0e1a, 15, 40);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.5, 0);

    const ambient = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambient);
    const spot = new THREE.SpotLight(0xc9a227, 2, 30, Math.PI / 6, 0.5);
    spot.position.set(0, 12, 0);
    spot.castShadow = true;
    scene.add(spot);
    const fill = new THREE.DirectionalLight(0x4466aa, 0.4);
    fill.position.set(-5, 5, 5);
    scene.add(fill);

    const stage = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.5, 0.3, 64), new THREE.MeshStandardMaterial({ color: 0x1a1a2e, metalness: 0.6, roughness: 0.3 }));
    stage.position.y = 0.15;
    stage.receiveShadow = true;
    scene.add(stage);

    const ring = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.08, 16, 64), new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.9, roughness: 0.2, emissive: 0xc9a227, emissiveIntensity: 0.3 }));
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.32;
    scene.add(ring);

    const wall = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), new THREE.MeshStandardMaterial({ color: 0x0d1525 }));
    wall.position.set(0, 4, -8);
    scene.add(wall);

    for (let i = 1; i <= 3; i++) {
      const cRing = new THREE.Mesh(new THREE.TorusGeometry(2 + i * 1.5, 0.05, 8, 64), new THREE.MeshStandardMaterial({ color: 0xc9a227, emissive: 0xc9a227, emissiveIntensity: 0.4 }));
      cRing.rotation.x = Math.PI / 2;
      cRing.position.y = 7 - i * 0.3;
      scene.add(cRing);
    }

    const effectGroup = new THREE.Group();
    scene.add(effectGroup);
    const loaded = [];

    function createTextPanel(title, subtitle, color = 0xc9a227) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(10, 20, 40, 0.92)';
      ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = '#' + color.toString(16).padStart(6, '0');
      ctx.lineWidth = 5;
      ctx.strokeRect(10, 10, 492, 236);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 42px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(title, 256, 115);
      ctx.font = '22px system-ui';
      ctx.fillStyle = '#c9a227';
      ctx.fillText(subtitle, 256, 175);
      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshStandardMaterial({ map: texture, transparent: true, metalness: 0.4, roughness: 0.35 });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 2.1), mat);
      mesh.castShadow = true;
      return mesh;
    }

    function createGrowingBars() {
      const group = new THREE.Group();
      const scores = [0.927, 0.883, 0.716, 0.642];
      const labels = ['MMLU', 'HumanEval', 'GPQA', 'MATH'];
      scores.forEach((score, i) => {
        const bar = new THREE.Mesh(
          new THREE.BoxGeometry(0.15, 0.1, 0.15),
          new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.7, roughness: 0.3, emissive: 0xc9a227, emissiveIntensity: 0.2 })
        );
        bar.position.set(-1.2 + i * 0.8, 0.5, 0);
        bar.scale.y = 0.01;
        group.add(bar);
        // Animate growth
        let h = 0.01;
        const target = score * 2.2;
        const grow = () => {
          h = Math.min(h + 0.03, target);
          bar.scale.y = h;
          bar.position.y = 0.5 + h / 2;
          if (h < target) requestAnimationFrame(grow);
        };
        setTimeout(grow, i * 150);
      });
      const panel = createTextPanel('AI BENCHMARKS', 'Growing Scores');
      panel.position.y = 2.2;
      group.add(panel);
      return group;
    }

    const effectMap = {
      params: ['70B', 'Parameters'],
      benchmark: ['AI BENCHMARKS', 'MMLU 92.7%'],
      vs: ['OpenAI VS Anthropic', 'Model Comparison'],
      valuation: ['$157B', 'Valuation'],
      safety: ['Safety Score', '85% Alignment'],
      gpu: ['10,000 H100s', 'GPU Cluster'],
      agent: ['AI Agent', 'Task Completed'],
      breaking: ['BREAKING', 'New Model Released', 0xe53935]
    };

    window.loadEffect = function(type) {
      const data = effectMap[type];
      if (!data) return;
      const mesh = createTextPanel(data[0], data[1], data[2] || 0xc9a227);
      mesh.position.set((Math.random() - 0.5) * 5, 1.8 + Math.random() * 1.5, -1.5);
      mesh.scale.set(0.05, 0.05, 0.05);
      effectGroup.add(mesh);
      loaded.push(mesh);
      let s = 0.05;
      const anim = () => {
        s = Math.min(s + 0.04, 1);
        mesh.scale.set(s, s, s);
        if (s < 1) requestAnimationFrame(anim);
      };
      anim();
    };

    window.loadBars = function() {
      const bars = createGrowingBars();
      bars.position.set(0, 1.2, -2);
      effectGroup.add(bars);
      loaded.push(bars);
    };

    window.clearEffects = function() {
      loaded.forEach(m => effectGroup.remove(m));
      loaded.length = 0;
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      ring.rotation.z += 0.0015;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
