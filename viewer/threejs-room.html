<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI News Room — Premium 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050810; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 12px; left: 12px; color: #e8c872; z-index: 100; background: rgba(5,8,16,0.75); padding: 14px; border-radius: 10px; border: 1px solid rgba(201,162,39,0.3); backdrop-filter: blur(8px); max-width: 380px; }
    button { background: linear-gradient(135deg, #c9a227, #e8c872); color: #0a0e1a; border: none; padding: 7px 12px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; }
    button:hover { filter: brightness(1.1); }
    .cinematic { background: linear-gradient(135deg, #ff6b00, #ffaa33); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong style="font-size:15px;">AI News Room — Premium 3D</strong><br>
    <button onclick="loadEffect('params')">70B Params</button>
    <button onclick="loadEffect('benchmark')">Benchmarks</button>
    <button onclick="loadBars()">Growing Bars</button>
    <button onclick="loadCinematic()" class="cinematic">Cinematic Reveal</button>
    <button onclick="loadEffect('vs')">VS</button>
    <button onclick="loadEffect('valuation')">$157B</button>
    <button onclick="loadEffect('agent')">Agent</button>
    <button onclick="clearEffects()">Clear</button><br>
    <small style="opacity:0.7;">Drag to orbit • Scroll to zoom</small>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050810);
    scene.fog = new THREE.FogExp2(0x050810, 0.035);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.2, 9.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.4, 0);
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 4;
    controls.maxDistance = 18;

    // Lighting — much richer
    const ambient = new THREE.AmbientLight(0x1a2040, 0.4);
    scene.add(ambient);

    const keyLight = new THREE.SpotLight(0xffe4a0, 3.5, 25, Math.PI / 5, 0.4, 1);
    keyLight.position.set(2, 10, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x6688ff, 0.6);
    rimLight.position.set(-6, 4, -4);
    scene.add(rimLight);

    const goldFill = new THREE.PointLight(0xc9a227, 1.2, 12);
    goldFill.position.set(0, 2.5, 0);
    scene.add(goldFill);

    // Multi-tier stage closer to generated visuals
    const stageMat = new THREE.MeshStandardMaterial({
      color: 0x0f1525,
      metalness: 0.75,
      roughness: 0.25,
      envMapIntensity: 0.8
    });
    const stage = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 4.2, 0.25, 80), stageMat);
    stage.position.y = 0.12;
    stage.receiveShadow = true;
    scene.add(stage);

    const stage2 = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 3.2, 0.18, 64), stageMat);
    stage2.position.y = 0.28;
    scene.add(stage2);

    // Gold rings with stronger emissive
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0xc9a227,
      metalness: 0.95,
      roughness: 0.15,
      emissive: 0xc9a227,
      emissiveIntensity: 0.45
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.9, 0.07, 20, 100), ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.26;
    scene.add(ring);

    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(3.1, 0.05, 16, 80), ringMat);
    ring2.rotation.x = Math.PI / 2;
    ring2.position.y = 0.4;
    scene.add(ring2);

    // Back wall with subtle grid-like feel
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0x0a1020,
      metalness: 0.3,
      roughness: 0.7
    });
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(22, 10), wallMat);
    wall.position.set(0, 4.5, -9);
    scene.add(wall);

    // Ceiling light rings — more prominent
    for (let i = 1; i <= 4; i++) {
      const cRing = new THREE.Mesh(
        new THREE.TorusGeometry(1.8 + i * 1.4, 0.04, 12, 80),
        new THREE.MeshStandardMaterial({ color: 0xc9a227, emissive: 0xc9a227, emissiveIntensity: 0.55, metalness: 0.9, roughness: 0.2 })
      );
      cRing.rotation.x = Math.PI / 2;
      cRing.position.y = 7.2 - i * 0.35;
      scene.add(cRing);
    }

    // Floor reflection plane (simple)
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(12, 64),
      new THREE.MeshStandardMaterial({ color: 0x060a14, metalness: 0.6, roughness: 0.4 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const effectGroup = new THREE.Group();
    scene.add(effectGroup);
    const loaded = [];

    function createPremiumPanel(title, subtitle, accent = '#c9a227') {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Dark glass background
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, 'rgba(12, 18, 36, 0.95)');
      grad.addColorStop(1, 'rgba(8, 12, 24, 0.92)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);

      // Gold border
      ctx.strokeStyle = accent;
      ctx.lineWidth = 8;
      ctx.strokeRect(16, 16, 992, 480);

      // Inner glow line
      ctx.strokeStyle = 'rgba(201,162,39,0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(28, 28, 968, 456);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 72px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, 512, 220);

      ctx.fillStyle = accent;
      ctx.font = '36px system-ui, -apple-system, sans-serif';
      ctx.fillText(subtitle, 512, 320);

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 16;
      const mat = new THREE.MeshStandardMaterial({
        map: texture,
        transparent: true,
        metalness: 0.55,
        roughness: 0.28,
        emissive: 0x111122,
        emissiveIntensity: 0.15
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 2.4), mat);
      mesh.castShadow = true;
      return mesh;
    }

    function createGrowingBars() {
      const group = new THREE.Group();
      const scores = [0.927, 0.883, 0.716, 0.642];
      scores.forEach((score, i) => {
        const bar = new THREE.Mesh(
          new THREE.BoxGeometry(0.28, 0.08, 0.28),
          new THREE.MeshStandardMaterial({
            color: 0xc9a227,
            metalness: 0.85,
            roughness: 0.2,
            emissive: 0xc9a227,
            emissiveIntensity: 0.35
          })
        );
        bar.position.set(-1.4 + i * 0.95, 0.4, 0);
        bar.scale.y = 0.02;
        bar.castShadow = true;
        group.add(bar);
        let h = 0.02;
        const target = score * 2.8;
        const grow = () => {
          h = Math.min(h + 0.04, target);
          bar.scale.y = h;
          bar.position.y = 0.4 + (h * 0.08) / 2;
          if (h < target) requestAnimationFrame(grow);
        };
        setTimeout(grow, i * 180);
      });
      const panel = createPremiumPanel('AI BENCHMARKS', 'Live Scores');
      panel.position.y = 2.6;
      group.add(panel);
      return group;
    }

    function createCinematicReveal() {
      const group = new THREE.Group();
      for (let i = 0; i < 60; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.045 + Math.random() * 0.03, 10, 10),
          new THREE.MeshStandardMaterial({
            color: 0xe8c872,
            emissive: 0xc9a227,
            emissiveIntensity: 1.1,
            metalness: 0.8,
            roughness: 0.15
          })
        );
        const angle = Math.random() * Math.PI * 2;
        const r = 0.1 + Math.random() * 0.4;
        p.position.set(Math.cos(angle) * r, 0.8 + Math.random() * 0.6, Math.sin(angle) * r);
        group.add(p);
        const tx = (Math.random() - 0.5) * 4.5;
        const ty = 1.2 + Math.random() * 2.5;
        const tz = (Math.random() - 0.5) * 2.5;
        let t = 0;
        const burst = () => {
          t += 0.018;
          p.position.x += (tx - p.position.x) * 0.045;
          p.position.y += (ty - p.position.y) * 0.045;
          p.position.z += (tz - p.position.z) * 0.045;
          if (t < 1.2) requestAnimationFrame(burst);
        };
        setTimeout(burst, i * 15);
      }
      const panel = createPremiumPanel('MAJOR BREAKTHROUGH', 'Cinematic Reveal');
      panel.position.y = 3.2;
      panel.scale.set(0.05, 0.05, 0.05);
      group.add(panel);
      let s = 0.05;
      const grow = () => {
        s = Math.min(s + 0.025, 1);
        panel.scale.set(s, s, s);
        if (s < 1) requestAnimationFrame(grow);
      };
      setTimeout(grow, 700);
      return group;
    }

    const effectMap = {
      params: ['70B', 'Parameters'],
      benchmark: ['AI BENCHMARKS', 'MMLU 92.7%'],
      vs: ['OpenAI  VS  Anthropic', 'Model Comparison'],
      valuation: ['$157B', 'Valuation'],
      agent: ['AI Agent', 'Task Complete']
    };

    window.loadEffect = function(type) {
      const data = effectMap[type];
      if (!data) return;
      const mesh = createPremiumPanel(data[0], data[1]);
      mesh.position.set((Math.random() - 0.5) * 4, 1.6 + Math.random() * 1.2, -1.2);
      mesh.scale.set(0.05, 0.05, 0.05);
      effectGroup.add(mesh);
      loaded.push(mesh);
      let s = 0.05;
      const anim = () => {
        s = Math.min(s + 0.035, 1);
        mesh.scale.set(s, s, s);
        if (s < 1) requestAnimationFrame(anim);
      };
      anim();
    };

    window.loadBars = function() {
      const bars = createGrowingBars();
      bars.position.set(0, 0.8, -1.5);
      effectGroup.add(bars);
      loaded.push(bars);
    };

    window.loadCinematic = function() {
      const cine = createCinematicReveal();
      cine.position.set(0, 0.3, -0.8);
      effectGroup.add(cine);
      loaded.push(cine);
    };

    window.clearEffects = function() {
      loaded.forEach(m => effectGroup.remove(m));
      loaded.length = 0;
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      ring.rotation.z += 0.0012;
      ring2.rotation.z -= 0.0008;
      goldFill.intensity = 1.1 + Math.sin(Date.now() * 0.001) * 0.15;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
