<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js News Room - 3D Effects</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0e1a; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; color: #c9a227; z-index: 100; background: rgba(10,14,26,0.7); padding: 12px; border-radius: 8px; }
    button { background: #c9a227; color: #0a0e1a; border: none; padding: 8px 12px; margin: 4px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #f5e6a3; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>Three.js News Room</strong><br>
    <button onclick="loadEffect('valuation')">Valuation</button>
    <button onclick="loadEffect('benchmark')">Benchmark</button>
    <button onclick="loadEffect('breaking')">Breaking</button>
    <button onclick="loadEffect('price')">Price</button>
    <button onclick="clearEffects()">Clear</button><br>
    <small>Drag to orbit • Scroll to zoom</small>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e1a);
    scene.fog = new THREE.Fog(0x0a0e1a, 15, 40);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.5, 0);

    // Lighting
    const ambient = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambient);
    const spot = new THREE.SpotLight(0xc9a227, 2, 30, Math.PI / 6, 0.5);
    spot.position.set(0, 12, 0);
    spot.castShadow = true;
    scene.add(spot);
    const fill = new THREE.DirectionalLight(0x4466aa, 0.4);
    fill.position.set(-5, 5, 5);
    scene.add(fill);

    // Floor / Stage
    const stageGeo = new THREE.CylinderGeometry(4, 4.5, 0.3, 64);
    const stageMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, metalness: 0.6, roughness: 0.3 });
    const stage = new THREE.Mesh(stageGeo, stageMat);
    stage.position.y = 0.15;
    stage.receiveShadow = true;
    scene.add(stage);

    const ringGeo = new THREE.TorusGeometry(4.2, 0.08, 16, 64);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.9, roughness: 0.2, emissive: 0xc9a227, emissiveIntensity: 0.3 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.32;
    scene.add(ring);

    // Back wall with subtle grid
    const wallGeo = new THREE.PlaneGeometry(20, 8);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x0d1525, metalness: 0.2, roughness: 0.8 });
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.set(0, 4, -8);
    scene.add(wall);

    // Ceiling rings (simplified)
    for (let i = 1; i <= 3; i++) {
      const cRing = new THREE.Mesh(
        new THREE.TorusGeometry(2 + i * 1.5, 0.05, 8, 64),
        new THREE.MeshStandardMaterial({ color: 0xc9a227, emissive: 0xc9a227, emissiveIntensity: 0.4 })
      );
      cRing.rotation.x = Math.PI / 2;
      cRing.position.y = 7 - i * 0.3;
      scene.add(cRing);
    }

    const effectGroup = new THREE.Group();
    scene.add(effectGroup);

    const loaded = [];

    function createTextPanel(title, subtitle, color = 0xc9a227) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(10, 20, 40, 0.9)';
      ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = '#' + color.toString(16).padStart(6, '0');
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, 496, 240);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 48px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(title, 256, 110);
      ctx.font = '24px system-ui';
      ctx.fillStyle = '#c9a227';
      ctx.fillText(subtitle, 256, 170);

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshStandardMaterial({ map: texture, transparent: true, metalness: 0.3, roughness: 0.4 });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4, 2), mat);
      mesh.castShadow = true;
      return mesh;
    }

    window.loadEffect = function(type) {
      let mesh;
      if (type === 'valuation') mesh = createTextPanel('$157B', 'Valuation • Series D');
      else if (type === 'benchmark') mesh = createTextPanel('AI BENCHMARK', 'MMLU 92.7%');
      else if (type === 'breaking') mesh = createTextPanel('BREAKING NEWS', 'Developing Story', 0xe53935);
      else if (type === 'price') mesh = createTextPanel('$42,995', 'Starting MSRP');
      else return;

      mesh.position.set((Math.random() - 0.5) * 4, 2 + Math.random(), -2);
      mesh.scale.set(0.1, 0.1, 0.1);
      effectGroup.add(mesh);
      loaded.push(mesh);

      // Simple scale-in animation
      let s = 0.1;
      const anim = () => {
        s += 0.05;
        mesh.scale.set(s, s, s);
        if (s < 1) requestAnimationFrame(anim);
      };
      anim();
    };

    window.clearEffects = function() {
      loaded.forEach(m => effectGroup.remove(m));
      loaded.length = 0;
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      ring.rotation.z += 0.002;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
